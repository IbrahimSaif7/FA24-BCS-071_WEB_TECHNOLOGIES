<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive Practice Store</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="container navbar-container">
        <a class="navbar-brand fw-bold" href="#"> MINI STORE </a>

        <div class="nav-links" id="mainNavbar">
          <a class="nav-link" href="#">Home</a>
          <a class="nav-link" href="#">Shop</a>
          <a class="nav-link" href="#">About</a>
          <a class="nav-link" href="#">Contact</a>
        </div>

        <a href="#" class="cart-link text-decoration-none"> 🛒 Cart </a>

        <button
          type="button"
          class="hamburger"
          id="menuToggle"
          aria-label="Toggle navigation"
          aria-controls="mainNavbar"
          aria-expanded="false"
        >
          ☰
        </button>
      </div>
    </nav>

    <header class="container text-center py-5">
      <h1>Our Products</h1>
      <p class="text-muted">A simple responsive product grid</p>
    </header>

    <main class="container pb-5">
      <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-1"></div>
            <h5>Product One</h5>
            <p>Rs. 1,500</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-2"></div>
            <h5>Product Two</h5>
            <p>Rs. 2,000</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-3"></div>
            <h5>Product Three</h5>
            <p>Rs. 2,500</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-4"></div>
            <h5>Product Four</h5>
            <p>Rs. 3,000</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-5"></div>
            <h5>Product Five</h5>
            <p>Rs. 1,800</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-6"></div>
            <h5>Product Six</h5>
            <p>Rs. 2,200</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-7"></div>
            <h5>Product Seven</h5>
            <p>Rs. 2,700</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="product-card">
            <div class="product-image image-8"></div>
            <h5>Product Eight</h5>
            <p>Rs. 3,500</p>
            <button class="btn btn-dark w-100">Add to Cart</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const menuToggle = document.getElementById("menuToggle");
      const mainNavbar = document.getElementById("mainNavbar");

      menuToggle.addEventListener("click", function () {
        mainNavbar.classList.toggle("active");

        const isOpen = mainNavbar.classList.contains("active");

        menuToggle.setAttribute("aria-expanded", isOpen);
      });
    </script>
  </body>
</html>
